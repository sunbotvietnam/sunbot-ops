services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sunbot_ops
      POSTGRES_USER: sunbot_ops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - sunbot_ops_pg:/var/lib/postgresql/data
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      - db
    ports:
      - "127.0.0.1:3010:3000"
volumes:
  sunbot_ops_pg:
