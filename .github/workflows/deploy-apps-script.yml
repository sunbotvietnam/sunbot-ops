name: Deploy Apps Script production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLASP_JSON: ${{ secrets.CLASP_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configure clasp credentials
        shell: bash
        run: |
          mkdir -p "$HOME"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json

      - name: Validate credential JSON
        shell: bash
        run: |
          test -s "$HOME/.clasprc.json" || { echo 'CLASPRC_JSON is empty'; exit 1; }
          test -s .clasp.json || { echo 'CLASP_JSON is empty'; exit 1; }
          jq -e . "$HOME/.clasprc.json" >/dev/null || { echo 'CLASPRC_JSON is not valid JSON'; exit 1; }
          jq -e . .clasp.json >/dev/null || { echo 'CLASP_JSON is not valid JSON'; exit 1; }
          jq -e 'has("scriptId") and has("rootDir")' .clasp.json >/dev/null || { echo 'CLASP_JSON must contain scriptId and rootDir'; exit 1; }

      - name: Push Apps Script source
        run: npx --yes @google/clasp@latest push --force

      - name: Create immutable version
        run: npx --yes @google/clasp@latest version "GitHub $GITHUB_SHA"
