name: Deploy Apps Script production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
      - '.github/workflows/deploy-apps-script.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
      CLASP_JSON: ${{ secrets.CLASP_JSON }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Write clasp credential files
        shell: bash
        run: |
          mkdir -p "$HOME"
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
          test -s "$HOME/.clasprc.json" || { echo 'CLASPRC_JSON is empty'; exit 1; }
          test -s .clasp.json || { echo 'CLASP_JSON is empty'; exit 1; }

      - name: Repair JSON syntax if needed
        shell: bash
        run: |
          if ! jq -e . "$HOME/.clasprc.json" >/dev/null 2>&1; then
            echo 'Repairing CLASPRC_JSON syntax locally on runner...'
            npx --yes jsonrepair "$HOME/.clasprc.json" --overwrite
          fi
          if ! jq -e . .clasp.json >/dev/null 2>&1; then
            echo 'Repairing CLASP_JSON syntax locally on runner...'
            npx --yes jsonrepair .clasp.json --overwrite
          fi
          jq -e . "$HOME/.clasprc.json" >/dev/null || { echo 'CLASPRC_JSON remains invalid after repair'; exit 1; }
          jq -e . .clasp.json >/dev/null || { echo 'CLASP_JSON remains invalid after repair'; exit 1; }
          echo 'Credential JSON validated.'

      - name: Validate clasp project mapping
        shell: bash
        run: |
          jq -e 'has("scriptId") and has("rootDir") and (.rootDir == "apps-script")' .clasp.json >/dev/null || { echo 'CLASP_JSON must contain scriptId and rootDir=apps-script'; exit 1; }

      - name: Push Apps Script source
        run: npx --yes @google/clasp@latest push --force

      - name: Create immutable version
        id: version
        shell: bash
        run: |
          OUT=$(npx --yes @google/clasp@latest create-version "GitHub $GITHUB_SHA")
          echo "$OUT"
          VERSION=$(printf '%s\n' "$OUT" | grep -Eo '[0-9]+' | tail -1)
          test -n "$VERSION" || { echo 'Không lấy được Apps Script version number'; exit 1; }
          echo "number=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or update production web app deployment
        shell: bash
        run: |
          VERSION='${{ steps.version.outputs.number }}'
          DEPLOY_FILE='apps-script/.production-deployment-id'
          if [ -s "$DEPLOY_FILE" ]; then
            DEPLOY_ID=$(tr -d '\r\n ' < "$DEPLOY_FILE")
            echo "Updating existing deployment $DEPLOY_ID"
            npx --yes @google/clasp@latest create-deployment --versionNumber "$VERSION" --description "SUNBOT OPS production $GITHUB_SHA" --deploymentId "$DEPLOY_ID"
          else
            echo 'No production deployment ID recorded; creating first web app deployment.'
            npx --yes @google/clasp@latest create-deployment --versionNumber "$VERSION" --description "SUNBOT OPS production $GITHUB_SHA"
          fi
