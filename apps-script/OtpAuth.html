<script>
(function(){
  const STORAGE_KEY='sunbot_ops_session';
  const LOGIN_ENDPOINT='https://script.google.com/macros/s/AKfycbw32BGSXwFVOpRCknx5hn8-k2m5ZXox26_y2mnZKVWL0JKHCv_Qtly5JiY0FS9e87kU/exec';

  window.initGoogle=function(){
    const injected=String(window.__SUNBOT_INITIAL_SESSION__||'');
    if(injected){
      localStorage.setItem(STORAGE_KEY,injected);
      ID_TOKEN=injected;
      callApi('bootstrap',{},data=>{BOOT=data;startApp();},true);
      return;
    }

    const saved=localStorage.getItem(STORAGE_KEY)||'';
    if(saved){
      ID_TOKEN=saved;
      callApi('bootstrap',{},data=>{BOOT=data;startApp();},true);
      return;
    }
    renderPasswordLogin();
  };

  window.callApi=function(action,payload,onOk,silentAuthFailure){
    setLoading(true);
    google.script.run
      .withSuccessHandler(r=>{setLoading(false);onOk&&onOk(r);})
      .withFailureHandler(err=>{
        setLoading(false);
        const msg=(err&&err.message)||String(err||'Có lỗi xảy ra.');
        if(/phiên đăng nhập|đăng nhập lại|không còn được cấp quyền/i.test(msg)){
          localStorage.removeItem(STORAGE_KEY);
          ID_TOKEN='';BOOT=null;
          document.getElementById('appView').classList.add('hidden');
          document.getElementById('loginView').classList.remove('hidden');
          renderPasswordLogin();
          if(!silentAuthFailure) showError(err);
          return;
        }
        showError(err);
      })
      .apiSession(ID_TOKEN,action,payload||{});
  };

  window.renderPasswordLogin=function(){
    const host=document.getElementById('googleSignIn');
    if(!host)return;
    host.innerHTML=`
      <form method="post" action="${LOGIN_ENDPOINT}" target="_top" style="display:grid;gap:10px;width:min(340px,100%);margin:0 auto;text-align:left" onsubmit="return preparePasswordSubmit(this)">
        <input type="hidden" name="action" value="adminPasswordLogin">
        <label style="font-size:13px;font-weight:600">Tên đăng nhập</label>
        <input id="adminUsername" name="username" class="input" type="text" autocomplete="username" value="admin" required>
        <label style="font-size:13px;font-weight:600">Mật khẩu</label>
        <input id="adminPassword" name="password" class="input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••" required>
        <button id="adminLoginBtn" class="btn" type="submit">Đăng nhập</button>
      </form>`;
    const msg=document.getElementById('loginMsg');
    if(msg)msg.textContent='Đăng nhập quản trị SUNBOT OPS.';
    setTimeout(()=>{const e=document.getElementById('adminPassword');if(e)e.focus();},50);
  };

  window.preparePasswordSubmit=function(){
    const btn=document.getElementById('adminLoginBtn');
    if(btn){btn.disabled=true;btn.textContent='Đang đăng nhập...';}
    const msg=document.getElementById('loginMsg');
    if(msg)msg.textContent='Đang xác thực trên máy chủ...';
    return true;
  };

  window.loginAdminPasswordUi=function(){
    const form=document.querySelector('#googleSignIn form');
    if(form) form.requestSubmit();
  };

  window.logoutSunbotOps=function(){
    localStorage.removeItem(STORAGE_KEY);
    ID_TOKEN='';BOOT=null;HOME=null;CURRENT_WEEKLY=null;
    document.getElementById('appView').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
    renderPasswordLogin();
    toast('Đã đăng xuất.');
  };

  document.addEventListener('DOMContentLoaded',()=>{
    try{ window.initGoogle({}); }
    catch(err){
      const msg=document.getElementById('loginMsg');
      if(msg) msg.textContent='Không khởi tạo được màn đăng nhập. Hãy tải lại trang.';
      console.error('SUNBOT OPS password auth init failed',err);
    }
  });
})();
</script>
