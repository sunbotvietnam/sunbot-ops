<script>
(function(){
  const STORAGE_KEY='sunbot_ops_session';

  window.initGoogle=function(){
    const saved=localStorage.getItem(STORAGE_KEY)||'';
    if(saved){
      ID_TOKEN=saved;
      callApi('bootstrap',{},data=>{BOOT=data;startApp();},true);
      return;
    }
    renderPasswordLogin();
  };

  window.callApi=function(action,payload,onOk,silentAuthFailure){
    setLoading(true);
    google.script.run
      .withSuccessHandler(r=>{setLoading(false);onOk&&onOk(r);})
      .withFailureHandler(err=>{
        setLoading(false);
        const msg=(err&&err.message)||String(err||'Có lỗi xảy ra.');
        if(/phiên đăng nhập|đăng nhập lại|không còn được cấp quyền/i.test(msg)){
          localStorage.removeItem(STORAGE_KEY);
          ID_TOKEN='';BOOT=null;
          document.getElementById('appView').classList.add('hidden');
          document.getElementById('loginView').classList.remove('hidden');
          renderPasswordLogin();
          if(!silentAuthFailure) showError(err);
          return;
        }
        showError(err);
      })
      .apiSession(ID_TOKEN,action,payload||{});
  };

  window.renderPasswordLogin=function(){
    const host=document.getElementById('googleSignIn');
    if(!host)return;
    host.innerHTML=`
      <div style="display:grid;gap:10px;width:min(340px,100%);margin:0 auto;text-align:left">
        <label style="font-size:13px;font-weight:600">Tên đăng nhập</label>
        <input id="adminUsername" class="input" type="text" autocomplete="username" value="admin">
        <label style="font-size:13px;font-weight:600">Mật khẩu</label>
        <input id="adminPassword" class="input" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
        <button id="adminLoginBtn" class="btn" onclick="loginAdminPasswordUi()">Đăng nhập</button>
      </div>`;
    const msg=document.getElementById('loginMsg');
    if(msg)msg.textContent='Đăng nhập quản trị SUNBOT OPS.';
    setTimeout(()=>{const e=document.getElementById('adminPassword');if(e)e.focus();},50);
  };

  window.loginAdminPasswordUi=function(){
    const username=(document.getElementById('adminUsername')?.value||'').trim();
    const password=(document.getElementById('adminPassword')?.value||'');
    if(!username||!password){toast('Hãy nhập tên đăng nhập và mật khẩu.');return;}
    const btn=document.getElementById('adminLoginBtn');
    if(btn){btn.disabled=true;btn.textContent='Đang đăng nhập...';}
    setLoading(true);
    google.script.run
      .withSuccessHandler(r=>{
        setLoading(false);
        if(btn){btn.disabled=false;btn.textContent='Đăng nhập';}
        ID_TOKEN=r.token;
        localStorage.setItem(STORAGE_KEY,ID_TOKEN);
        callApi('bootstrap',{},data=>{BOOT=data;startApp();});
      })
      .withFailureHandler(err=>{
        setLoading(false);
        if(btn){btn.disabled=false;btn.textContent='Đăng nhập';}
        const msg=document.getElementById('loginMsg');
        if(msg)msg.textContent=(err&&err.message)||'Đăng nhập không thành công.';
        showError(err);
      })
      .loginAdminPassword(username,password);
  };

  window.logoutSunbotOps=function(){
    localStorage.removeItem(STORAGE_KEY);
    ID_TOKEN='';BOOT=null;HOME=null;CURRENT_WEEKLY=null;
    document.getElementById('appView').classList.add('hidden');
    document.getElementById('loginView').classList.remove('hidden');
    renderPasswordLogin();
    toast('Đã đăng xuất.');
  };

  document.addEventListener('DOMContentLoaded',()=>{
    try{ window.initGoogle({}); }
    catch(err){
      const msg=document.getElementById('loginMsg');
      if(msg) msg.textContent='Không khởi tạo được màn đăng nhập. Hãy tải lại trang.';
      console.error('SUNBOT OPS password auth init failed',err);
    }
  });
})();
</script>
