<script>
(function(){
  const OTP_ENDPOINT='https://script.google.com/macros/s/AKfycbw32BGSXwFVOpRCknx5hn8-k2m5ZXox26_y2mnZKVWL0JKHCv_Qtly5JiY0FS9e87kU/exec';

  window.requestLoginCode=async function(){
    const email=(document.getElementById('loginEmail')?.value||'').trim().toLowerCase();
    if(!email){toast('Hãy nhập email.');return;}

    const btn=document.getElementById('sendOtpBtn');
    const msg=document.getElementById('loginMsg');
    if(btn){btn.disabled=true;btn.textContent='Đang gửi...';}
    if(msg)msg.textContent='Đang gửi yêu cầu mã đăng nhập...';
    setLoading(true);

    const body=new URLSearchParams();
    body.set('action','requestOtp');
    body.set('email',email);

    try{
      await fetch(OTP_ENDPOINT,{
        method:'POST',
        mode:'no-cors',
        credentials:'omit',
        headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
        body:body.toString(),
        redirect:'follow',
        cache:'no-store'
      });

      setLoading(false);
      if(btn){btn.disabled=false;btn.textContent='Gửi lại mã';}
      const step=document.getElementById('otpStep');if(step)step.classList.remove('hidden');
      if(msg)msg.textContent='Yêu cầu gửi mã đã tới máy chủ. Hãy kiểm tra Inbox/Spam trong ít phút.';
      const otp=document.getElementById('loginOtp');if(otp)otp.focus();
    }catch(err){
      setLoading(false);
      if(btn){btn.disabled=false;btn.textContent='Gửi mã đăng nhập';}
      const text='Không gửi được yêu cầu OTP tới máy chủ. Hãy tải lại trang và thử lại.';
      if(msg)msg.textContent=text;
      console.error('OTP HTTP transport failed',err);
      toast(text);
    }
  };
})();
</script>
