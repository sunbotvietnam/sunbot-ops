<script>
(function(){
  const OTP_ENDPOINT='https://script.google.com/macros/s/AKfycbw32BGSXwFVOpRCknx5hn8-k2m5ZXox26_y2mnZKVWL0JKHCv_Qtly5JiY0FS9e87kU/exec';

  window.requestLoginCode=function(){
    const email=(document.getElementById('loginEmail')?.value||'').trim().toLowerCase();
    if(!email){toast('Hãy nhập email.');return;}

    const btn=document.getElementById('sendOtpBtn');
    const msg=document.getElementById('loginMsg');
    if(btn){btn.disabled=true;btn.textContent='Đang gửi...';}
    if(msg)msg.textContent='Đang chuyển yêu cầu tới máy chủ...';
    setLoading(true);

    const form=document.createElement('form');
    form.method='POST';
    form.action=OTP_ENDPOINT;
    form.target='_top';
    form.style.display='none';

    const action=document.createElement('input');
    action.type='hidden';action.name='action';action.value='requestOtp';
    const emailInput=document.createElement('input');
    emailInput.type='hidden';emailInput.name='email';emailInput.value=email;
    form.appendChild(action);
    form.appendChild(emailInput);
    document.body.appendChild(form);
    form.submit();
  };
})();
</script>
