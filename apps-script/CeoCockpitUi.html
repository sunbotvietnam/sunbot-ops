<script>
(function(){
  function ceoCall(action,payload,onOk){
    if(!(BOOT&&BOOT.can&&BOOT.can['ceo.view'])) return;
    google.script.run.withSuccessHandler(function(r){if(onOk)onOk(r);}).withFailureHandler(function(err){console.error('Tình báo điều hành',err);}).apiSessionCeo(ID_TOKEN,action,payload||{});
  }
  function outreachCeoCall(onOk){
    if(!(BOOT&&BOOT.can&&BOOT.can['ceo.view'])) return;
    google.script.run.withSuccessHandler(function(r){if(onOk)onOk(r);}).withFailureHandler(function(err){console.error('Tiếp cận trường',err);}).apiSessionOutreach(ID_TOKEN,'summary',{});
  }

  var baseRenderHome=window.renderHome;
  window.renderHome=function(){
    baseRenderHome();
    if(!(BOOT&&BOOT.can&&BOOT.can['ceo.view'])) return;
    var screen=document.getElementById('screen-home');
    if(!screen||document.getElementById('ceoCockpit')) return;
    var box=document.createElement('div');
    box.id='ceoCockpit';
    box.style.marginTop='18px';
    box.innerHTML='<div class="card"><h2>Bảng điều hành kinh doanh</h2><div class="muted small">Đang tổng hợp cơ hội, dòng tiền, thực thi và thông tin thị trường...</div></div>';
    screen.appendChild(box);
    loadCeoCockpit();
  };

  window.loadCeoCockpit=function(){
    ceoCall('cockpit',{days:7},function(r){
      var host=document.getElementById('ceoCockpit'); if(!host)return;
      var s=r.summary;
      host.innerHTML='<div class="page-head"><div><span class="chip">CEO · 7 ngày</span><h1 style="font-size:22px">Bảng điều hành kinh doanh</h1><p>Dữ liệu được tổng hợp trực tiếp từ nguồn vận hành chuẩn.</p></div></div>'+
        '<div class="grid4">'+
        metric('Giá trị cơ hội theo xác suất',money(s.weighted_pipeline),s.active_opportunities+' cơ hội','green')+
        metric('Việc quá hạn',s.overdue_tasks,s.ceo_tasks+' việc cần CEO',s.overdue_tasks?'red':'green')+
        metric('Tiền dự kiến 7 ngày',money(s.cash_expected_7d),'Công nợ mở '+money(s.outstanding_receivables),'green')+
        metric('Thông tin thị trường đã xác minh',s.accepted_market_facts,s.pending_market_review+' thông tin chờ duyệt',s.pending_market_review?'orange':'blue')+
        '</div><div id="ceoOutreachBox" style="margin-top:14px"></div><div class="grid2" style="margin-top:14px"><div class="card"><h2>Cơ hội quan trọng</h2>'+renderTopOpps(r.pipeline.top)+'</div><div class="card"><h2>Quyết định cần CEO</h2>'+renderDecisions(r.decisions)+'</div></div>'+
        '<div class="grid2" style="margin-top:14px"><div class="card"><h2>Thông tin thị trường</h2>'+renderFacts(r.market.facts)+'</div><div class="card" id="ceoWeeklyBox"><h2>Tổng hợp điều hành tuần</h2><div class="muted small">Đang tổng hợp...</div></div></div>';
      loadCeoWeeklyBox();
      loadOutreachCeoBox();
    });
  };

  function loadOutreachCeoBox(){
    outreachCeoCall(function(s){
      var host=document.getElementById('ceoOutreachBox');if(!host)return;
      host.innerHTML='<div class="card"><div class="section-title"><h2>Tiếp cận trường</h2><button class="btn ghost" onclick="showScreen(\'outreach\')">Xem danh sách</button></div><div class="grid4">'+
        metric('Cần xử lý',s.can_lam_hom_nay,'Đang giao cho đội ngũ')+
        metric('Cần gửi hồ sơ',s.can_gui,'Đã đủ dữ liệu để gửi')+
        metric('Đang chờ phản hồi',s.dang_cho_phan_hoi,'Đã gửi hồ sơ')+
        metric('Đã có phản hồi',s.da_phan_hoi,'Tín hiệu tiếp theo','green')+
        '</div></div>';
    });
  }

  function renderTopOpps(rows){
    if(!rows||!rows.length)return '<div class="muted small">Chưa có cơ hội.</div>';
    return rows.slice(0,6).map(function(o){return '<div class="account"><div><b>'+esc(o.account||o.name||'')+'</b><div class="task-sub">'+esc(o.name||'')+' · '+esc(stageLabelCeo(o.stage||''))+' · '+esc(o.owner||'')+'</div></div><div><b>'+money(o.value)+'</b><div class="task-sub">Khả năng '+esc(o.probability||0)+'%</div></div></div>';}).join('');
  }
  function stageLabelCeo(v){return ({TARGET:'Mục tiêu',CONTACTED:'Đã liên hệ',DISCOVERY:'Đang tìm hiểu nhu cầu',PROPOSAL:'Đã gửi đề xuất',NEGOTIATION:'Đang thương lượng',WON:'Đã chốt',LOST:'Không thành công',HOLD:'Tạm dừng'})[v]||v;}
  function renderDecisions(rows){
    if(!rows||!rows.length)return '<div class="muted small">Không có việc cần CEO quyết định.</div>';
    return rows.slice(0,6).map(function(d){return '<div class="task"><div class="task-bar orange"></div><div><div class="task-title">'+esc(d.description||'')+'</div><div class="task-sub">'+esc(d.ask||'')+' · '+esc(d.owner||'')+'</div></div><div class="task-due">'+esc(d.due||'')+'</div></div>';}).join('');
  }
  function renderFacts(rows){
    if(!rows||!rows.length)return '<div class="muted small">Chưa có thông tin mới được xác minh trong kỳ.</div>';
    return rows.slice(0,6).map(function(f){return '<div class="task"><div class="task-bar"></div><div><div class="task-title">'+esc(f.fact||'')+'</div><div class="task-sub">'+esc(f.subject||'')+' · Độ tin cậy '+esc(f.confidence||'')+'</div></div></div>';}).join('');
  }
  function loadCeoWeeklyBox(){
    ceoCall('weekly',{days:7},function(r){
      var host=document.getElementById('ceoWeeklyBox');if(!host)return;
      var e=r.executive_summary;
      var risk=r.team_attention||[];
      host.innerHTML='<div class="section-title"><h2>Tổng hợp điều hành tuần</h2><span class="chip">'+esc(r.period.from)+' → '+esc(r.period.to)+'</span></div><div class="report-box">• '+esc(e.pipeline)+'\n• '+esc(e.execution)+'\n• '+esc(e.cash)+'\n• '+esc(e.market)+'</div>'+(risk.length?'<div class="hint" style="margin-top:10px"><b>Cần chú ý:</b> '+risk.slice(0,4).map(function(x){return esc(x.ho_ten)+' ('+x.followup.overdue+' quá hạn)';}).join(' · ')+'</div>':'');
    });
  }
})();
</script>
