<script>
(function(){
  function ccall(action,payload,onOk){
    setLoading(true);
    google.script.run
      .withSuccessHandler(r=>{setLoading(false);onOk&&onOk(r);})
      .withFailureHandler(err=>{setLoading(false);showError(err);})
      .apiSessionCommercial(ID_TOKEN,action,payload||{});
  }

  const originalShowScreen=window.showScreen;
  window.showScreen=function(name){
    if(name!=='commercial') return originalShowScreen(name);
    document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));
    const el=document.getElementById('screen-commercial'); if(el) el.classList.add('active');
    document.querySelectorAll('.sidebar button').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));
    renderCommercial('opps');
  };

  window.renderCommercial=function(tab){
    const host=document.getElementById('screen-commercial'); if(!host)return;
    host.innerHTML=`<div class="page-head"><div><span class="chip">Kinh doanh</span><h1>Trường & Cơ hội</h1><p>Ghi đúng tình hình, việc tiếp theo và hạn xử lý. Không cần nhớ cấu trúc hệ thống.</p></div></div>
      <div class="tabs"><button class="${tab==='opps'?'active':''}" onclick="renderCommercial('opps')">Cơ hội bán hàng</button><button class="${tab==='signals'?'active':''}" onclick="renderCommercial('signals')">Thông tin thị trường</button><button class="${tab==='kpi'?'active':''}" onclick="renderCommercial('kpi')">Kết quả</button></div><div id="commercialBody"></div>`;
    if(tab==='signals') loadSignals(); else if(tab==='opps') loadOpps(); else loadKpi();
  };

  function loadSignals(){
    ccall('marketSignals',{},rows=>{
      const host=document.getElementById('commercialBody');
      host.innerHTML=`<div class="grid2"><div class="card"><h2>Ghi nhận thông tin mới</h2>
      <div class="field"><label>Đối thủ / đơn vị liên quan</label><select id="cs_competitor" class="input"><option value="">Chưa xác định / không liên quan</option></select></div>
      <div class="field" style="margin-top:10px"><label>Trường liên quan</label><select id="cs_account" class="input"><option value="">Không gắn trường</option></select></div>
      <div class="field" style="margin-top:10px"><label>Tôi biết được điều gì? *</label><textarea id="cs_signal" class="input" placeholder="Ghi đúng điều mình thấy, nghe hoặc được gửi. Không cần tự phân tích."></textarea></div>
      <div class="field" style="margin-top:10px"><label>Biết từ đâu? *</label><select id="cs_source" class="input"><option value="TAN_MAT_THAY">Tôi tận mắt thấy</option><option value="NGUOI_TRONG_TRUONG_NOI">Người trong trường nói</option><option value="THAY_TREN_MANG">Tôi thấy trên mạng</option><option value="TAI_LIEU_ANH_DUOC_GUI">Tài liệu/ảnh được gửi</option><option value="NGHE_KE">Nghe người khác kể</option><option value="KHAC">Khác</option></select></div>
      <div class="field" style="margin-top:10px"><label>Ai cung cấp thông tin?</label><input id="cs_person" class="input"></div>
      <div class="field" style="margin-top:10px"><label>Link / ảnh / tài liệu</label><input id="cs_evidence" class="input" placeholder="https://..."></div>
      <div class="hint" style="margin-top:12px">Chỉ ghi điều mình thực sự biết. Người duyệt sẽ xác minh khi cần.</div><button class="btn" style="margin-top:12px" onclick="saveMarketSignal()">Lưu thông tin</button></div>
      <div class="card"><h2>Thông tin gần đây</h2>${rows.length?rows.slice(0,20).map(signalHtml).join(''):'<div class="muted small">Chưa có thông tin.</div>'}</div></div>`;
      callApi('accounts',{q:''},accounts=>{const el=document.getElementById('cs_account');if(el)el.innerHTML='<option value="">Không gắn trường</option>'+accounts.map(a=>`<option value="${esc(a.account_id)}">${esc(a.ten_don_vi)}</option>`).join('');});
      ccall('marketOverview',{},r=>{const el=document.getElementById('cs_competitor');if(el)el.innerHTML='<option value="">Chưa xác định / không liên quan</option>'+(r.competitors||[]).map(c=>`<option value="${esc(c.competitor_id)}">${esc(c.ten_don_vi)} · ${esc(c.radar_priority||'')}</option>`).join('');});
    });
  }

  function signalHtml(s){const status=String(s.review_status||'CHUA_REVIEW');return `<div class="task"><div class="task-bar ${status==='DU_CAN_CU'?'':'orange'}"></div><div><div class="task-title">${esc(s.raw_signal||'')}</div><div class="task-sub">${s.competitor_id?'<b>'+esc(s.competitor_id)+'</b> · ':''}${esc(sourceLabel(s.source_type))} · ${esc(statusLabelCi(status))}${s.verified_fact?'<br><b>Đã xác minh:</b> '+esc(s.verified_fact):''}</div></div><div class="task-due">${esc(String(s.captured_at||'').slice(0,10))}</div></div>`;}
  function sourceLabel(v){return ({TAN_MAT_THAY:'Tận mắt thấy',NGUOI_TRONG_TRUONG_NOI:'Người trong trường nói',THAY_TREN_MANG:'Trên mạng',TAI_LIEU_ANH_DUOC_GUI:'Tài liệu/ảnh',NGHE_KE:'Nghe kể',KHAC:'Khác'})[v]||v||'';}
  function statusLabelCi(v){return ({CHUA_REVIEW:'Chưa duyệt',DU_CAN_CU:'Đủ căn cứ',CAN_XAC_MINH_THEM:'Cần xác minh thêm',KHONG_DUNG:'Không dùng'})[v]||v||'';}

  window.saveMarketSignal=function(){
    const p={competitor_id:val('cs_competitor'),account_id:val('cs_account'),raw_signal:val('cs_signal'),source_type:val('cs_source'),source_person:val('cs_person'),evidence_url:val('cs_evidence'),needs_verification:true};
    ccall('createMarketSignal',p,r=>{toast(r.message||'Đã lưu');loadSignals();});
  };

  function loadOpps(){
    ccall('opportunities',{},rows=>{
      const host=document.getElementById('commercialBody');
      const total=rows.reduce((s,r)=>s+Number(r.gia_tri_du_kien||0),0);
      host.innerHTML=`<div class="hint" style="margin-bottom:12px"><b>Chỉ cần nhớ:</b> một cơ hội đang làm phải có <b>tình hình hiện tại + việc tiếp theo + ngày cần làm</b>.</div>
      <div class="grid4">${metric('Tổng cơ hội',rows.length,'Đang theo dõi')}${metric('Đã gửi đề xuất',rows.filter(r=>r.trang_thai==='PROPOSAL').length,'Đã gửi phương án')}${metric('Đang thương lượng',rows.filter(r=>r.trang_thai==='NEGOTIATION').length,'Đang trao đổi điều kiện')}${metric('Tổng giá trị',money(total),'Giá trị dự kiến','green')}</div>
      <div class="card" style="margin-top:14px"><div class="section-title"><h2>Danh sách cơ hội</h2><button class="btn" onclick="openOpportunityForm()">+ Tạo cơ hội</button></div><div id="oppForm"></div><div id="oppUpdate"></div>${rows.length?rows.map(oppHtml).join(''):'<div class="muted small" style="padding:14px 0">Chưa có cơ hội. Khi một trường có nhu cầu cụ thể, bấm “Tạo cơ hội”.</div>'}</div>`;
    });
  }

  function oppHtml(o){
    const next=o.viec_tiep_theo?`<div class="task-sub"><b>Việc tiếp theo:</b> ${esc(o.viec_tiep_theo)}${o.han_viec_tiep_theo?' · '+esc(String(o.han_viec_tiep_theo).slice(0,10)):''}</div>`:'';
    return `<div class="account"><div><b>${esc(o.ten_co_hoi)}</b><div class="task-sub">${esc(o.san_pham||'')} · ${esc(stageLabel(o.trang_thai||''))}</div>${next}</div><div style="text-align:right"><b>${money(o.gia_tri_du_kien)}</b><div class="task-sub">Khả năng ${esc(o.xac_suat||0)}%</div><button class="btn ghost" style="margin-top:6px" onclick='openOpportunityUpdate(${JSON.stringify(JSON.stringify(o))})'>Cập nhật</button></div></div>`;
  }

  function stageLabel(v){return ({TARGET:'Mới xác định',CONTACTED:'Đã liên hệ',DISCOVERY:'Đang tìm hiểu nhu cầu',PROPOSAL:'Đã gửi đề xuất',NEGOTIATION:'Đang thương lượng',WON:'Đã chốt',LOST:'Không tiếp tục',HOLD:'Tạm dừng'})[v]||v;}

  window.openOpportunityForm=function(){
    const host=document.getElementById('oppForm');
    host.innerHTML=`<div class="card" style="margin:10px 0;background:#f8fafc"><h3>Tạo cơ hội mới</h3><div class="form-grid"><div class="field"><label>Trường *</label><select id="co_account" class="input"></select></div><div class="field"><label>Nhu cầu chính *</label><select id="co_product" class="input"><option>Lập trình tư duy cùng Sunbot</option><option>STEAM Sáng tạo cùng Sunbot</option><option>Phòng học / thiết bị</option><option>Chuyển giao / đào tạo</option><option>Sự kiện</option><option>Khác</option></select></div><div class="field"><label>Tên cơ hội *</label><input id="co_name" class="input" placeholder="Ví dụ: Triển khai Sunbot năm học 2026–2027"></div><div class="field"><label>Giá trị dự kiến</label><input id="co_value" class="input" inputmode="numeric" placeholder="Chưa rõ có thể để trống"></div><div class="field"><label>Việc tiếp theo</label><input id="co_next" class="input" placeholder="Ví dụ: Hẹn hiệu trưởng trao đổi phương án"></div><div class="field"><label>Ngày cần làm</label><input id="co_due" type="date" class="input"></div></div><button class="btn" style="margin-top:10px" onclick="saveOpportunity()">Lưu cơ hội</button></div>`;
    callApi('accounts',{q:''},rows=>{const e=document.getElementById('co_account');if(e)e.innerHTML=rows.map(a=>`<option value="${esc(a.account_id)}">${esc(a.ten_don_vi)}</option>`).join('');});
  };

  window.saveOpportunity=function(){
    const p={account_id:val('co_account'),ten_co_hoi:val('co_name'),san_pham:val('co_product'),gia_tri_du_kien:val('co_value'),viec_tiep_theo:val('co_next'),han_viec_tiep_theo:val('co_due')};
    ccall('createOpportunity',p,r=>{toast(r.message||'Đã tạo');loadOpps();});
  };

  window.openOpportunityUpdate=function(raw){
    const o=JSON.parse(raw),host=document.getElementById('oppUpdate'); if(!host)return;
    host.innerHTML=`<div class="card" style="margin:10px 0;background:#fff7ed"><h3>Cập nhật: ${esc(o.ten_co_hoi||'Cơ hội')}</h3><div class="form-grid"><div class="field"><label>Tình hình hiện tại *</label><select id="cu_stage" class="input"><option value="TARGET">Mới xác định</option><option value="CONTACTED">Đã liên hệ</option><option value="DISCOVERY">Đang tìm hiểu nhu cầu</option><option value="PROPOSAL">Đã gửi đề xuất</option><option value="NEGOTIATION">Đang thương lượng</option><option value="WON">Đã chốt</option><option value="HOLD">Tạm dừng</option><option value="LOST">Không tiếp tục</option></select></div><div class="field"><label>Kết quả vừa có *</label><input id="cu_result" class="input" placeholder="Nêu kết quả cụ thể, không chỉ ghi 'đã gọi'"></div><div class="field"><label>Việc tiếp theo *</label><input id="cu_next" class="input" value="${esc(o.viec_tiep_theo||'')}" placeholder="Một việc cụ thể"></div><div class="field"><label>Ngày cần làm *</label><input id="cu_due" type="date" class="input" value="${esc(String(o.han_viec_tiep_theo||'').slice(0,10))}"></div><div class="field"><label>Lý do nếu không tiếp tục</label><input id="cu_lost" class="input" placeholder="Chỉ cần điền khi chọn Không tiếp tục"></div><div class="field"><label>Tiền dự kiến về (nếu đã rõ)</label><input id="cu_cash" type="date" class="input" value="${esc(String(o.expected_cash_date||'').slice(0,10))}"></div></div><button class="btn" style="margin-top:10px" onclick="saveOpportunityUpdate('${esc(o.opp_id)}')">Lưu cập nhật</button></div>`;
    const stage=document.getElementById('cu_stage'); if(stage)stage.value=String(o.trang_thai||'TARGET');
    host.scrollIntoView({behavior:'smooth',block:'start'});
  };

  window.saveOpportunityUpdate=function(oppId){
    const p={opp_id:oppId,trang_thai:val('cu_stage'),ket_qua:val('cu_result'),viec_tiep_theo:val('cu_next'),han:val('cu_due'),lost_reason:val('cu_lost'),expected_cash_date:val('cu_cash')};
    ccall('updateOpportunityStage',p,r=>{toast(r.message||'Đã cập nhật');loadOpps();});
  };

  function loadKpi(){
    ccall('kpi',{days:7},r=>{const host=document.getElementById('commercialBody');host.innerHTML=`<div class="grid4">${metric('Độ phủ trường',r.schoolCoverage.rate+'%',r.schoolCoverage.touched+'/'+r.schoolCoverage.owned+' trường có cập nhật')}${metric('Theo dõi đúng hạn',r.followup.onTimeRate+'%',r.followup.overdue+' việc quá hạn',r.followup.overdue?'red':'green')}${metric('Cập nhật đủ thông tin',r.workEvidence.validRate+'%',r.workEvidence.valid+'/'+r.workEvidence.updates+' cập nhật')}${metric('Tiền dự kiến',money(r.pipeline.expectedCash),'Theo khả năng của từng cơ hội','green')}</div><div class="grid2" style="margin-top:14px"><div class="card"><h2>Cơ hội bán hàng</h2><div class="report-box">Tổng cơ hội: ${r.pipeline.total}\nĐã gửi đề xuất: ${r.pipeline.proposals}\nĐã chốt: ${r.pipeline.wins}</div></div><div class="card"><h2>Thông tin thị trường</h2><div class="report-box">Thông tin ghi nhận: ${r.intelligence.signals}\nĐược xác minh đủ căn cứ: ${r.intelligence.accepted}</div></div></div>`;});
  }
})();
</script>
