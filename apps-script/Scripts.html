<script>
let ID_TOKEN=''; let BOOT=null; let HOME=null; let CURRENT_WEEKLY=null;

document.addEventListener('DOMContentLoaded',()=>{
  google.script.run.withSuccessHandler(initGoogle).withFailureHandler(showError).getPublicConfig();
});

function initGoogle(cfg){
  if(!cfg.googleClientId){document.getElementById('loginMsg').textContent='Hệ thống chưa cấu hình Google Client ID.';return;}
  const wait=()=>{if(!(window.google&&google.accounts&&google.accounts.id)){setTimeout(wait,200);return;}
    google.accounts.id.initialize({client_id:cfg.googleClientId,callback:onGoogleCredential,auto_select:true});
    google.accounts.id.renderButton(document.getElementById('googleSignIn'),{theme:'outline',size:'large',shape:'pill',text:'signin_with'});
    google.accounts.id.prompt();
  }; wait();
}

function onGoogleCredential(res){ID_TOKEN=res.credential; callApi('bootstrap',{},data=>{BOOT=data; startApp();});}
function callApi(action,payload,onOk){setLoading(true);google.script.run.withSuccessHandler(r=>{setLoading(false);onOk&&onOk(r);}).withFailureHandler(showError).api(ID_TOKEN,action,payload||{});}
function startApp(){document.getElementById('loginView').classList.add('hidden');document.getElementById('appView').classList.remove('hidden');document.getElementById('userLine').textContent=`${BOOT.user.ho_ten} · ${(BOOT.user.roleNames||[]).join(' + ')}`;if(BOOT.can['admin.people'])document.getElementById('adminNav').classList.remove('hidden');renderUpdate();reloadHome();loadTasks('DOING');loadAccounts();loadWeekly();}
function showScreen(name){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById('screen-'+name).classList.add('active');document.querySelectorAll('.sidebar button').forEach(b=>b.classList.toggle('active',b.dataset.screen===name));if(name==='home')reloadHome();if(name==='accounts')loadAccounts();if(name==='weekly')loadWeekly();if(name==='admin')loadAdmin();}
function reloadHome(){callApi('home',{},r=>{HOME=r;renderHome();renderUpdate();});}
function renderHome(){const s=HOME.summary;document.getElementById('screen-home').innerHTML=`<div class="page-head"><div><span class="chip">Hôm nay</span><h1>Chào ${esc(BOOT.user.ho_ten)} 👋</h1><p>${esc((BOOT.user.roleNames||[]).join(' · '))}</p></div><button class="btn" onclick="showScreen('update')">+ Cập nhật nhanh</button></div><div class="grid4">${metric('Việc đang mở',s.open,'Đang cần theo dõi')}${metric('Quá hạn',s.overdue,'Cần xử lý sớm','red')}${metric('Cần CEO',s.ceo,'Cần quyết định/hỗ trợ','orange')}${metric('Tiền dự kiến 7 ngày',money(s.cash7),'Theo dữ liệu công nợ','green')}</div><div class="grid2" style="margin-top:16px"><div class="card"><div class="section-title"><h2>Việc cần làm</h2><button class="btn ghost" onclick="showScreen('tasks')">Xem tất cả</button></div>${(HOME.priorityTasks||[]).length?(HOME.priorityTasks||[]).map(taskHtml).join(''):'<div class="muted small">Không có việc đang mở.</div>'}</div><div class="card"><div class="section-title"><h2>Báo cáo tuần đang hình thành</h2></div><p class="muted small">Hệ thống tự gom cập nhật, việc hoàn thành và vấn đề trong tuần. Thứ Bảy bạn chỉ cần review, bổ sung nhận định và gửi.</p><button class="btn secondary" onclick="showScreen('weekly')">Xem bản tổng hợp</button></div></div>`;}
function metric(l,v,n,t='blue'){const color=t==='red'?'var(--red)':t==='orange'?'var(--orange)':t==='green'?'var(--green)':'var(--blue)';return `<div class="card"><div class="metric-label">${esc(l)}</div><div class="metric-value" style="color:${color}">${esc(v)}</div><div class="metric-note">${esc(n)}</div></div>`;}
function taskHtml(t){return `<div class="task"><div class="task-bar ${t.can_ceo?'orange':t.muc_uu_tien==='HIGH'?'red':''}"></div><div><div class="task-title">${esc(t.ten_cong_viec)}</div><div class="task-sub">${esc(t.hanh_dong_tiep||'')}</div></div><div class="task-due">${esc(t.ngay_hanh_dong_tiep||t.han_hoan_thanh||'')}</div></div>`;}

function renderUpdate(){const accounts=(HOME&&HOME.accounts)||[];document.getElementById('screen-update').innerHTML=`<div class="page-head"><div><h1>Cập nhật nhanh</h1><p>Chỉ cập nhật khi có thay đổi đáng kể. Mục tiêu 30–60 giây.</p></div></div><div class="card"><div class="form-grid"><div class="field"><label>Trường/đơn vị</label><select id="u_account" class="input"><option value="">Không gắn với trường</option></select></div><div class="field"><label>Loại cập nhật *</label><select id="u_type" class="input"><option value="THI_TRUONG">Thị trường</option><option value="CONG_NO">Công nợ</option><option value="VAN_HANH">Vận hành</option><option value="TAI_LIEU">Tài liệu</option><option value="CHUONG_TRINH">Chương trình</option></select></div><div class="field span2"><label>Kết quả *</label><textarea id="u_result" class="input" placeholder="Ví dụ: Hiệu trưởng đồng ý xem phương án chuyển giao; đề nghị gửi trước 12/8."></textarea></div><div class="field"><label>Trạng thái mới</label><select id="u_status" class="input"><option value="">Không đổi</option><option value="CONTACTED">Đã liên hệ</option><option value="MEETING">Đã làm việc</option><option value="PROPOSAL">Đã gửi đề xuất</option><option value="NEGOTIATION">Đang đàm phán</option><option value="WON">Đã chốt</option><option value="WAITING">Đang chờ</option></select></div><div class="field"><label>Việc tiếp theo *</label><input id="u_next" class="input" placeholder="Ví dụ: Gửi đề xuất chương trình"></div><div class="field"><label>Hạn *</label><input id="u_due" class="input" type="date"></div><div class="field"><label>Mức độ *</label><select id="u_level" class="input"><option value="BINH_THUONG">Bình thường</option><option value="QUAN_TRONG">Quan trọng</option><option value="CAN_CEO">Cần CEO</option></select></div><div class="field span2"><label>Nếu cần CEO, ghi rõ cần quyết định/hỗ trợ gì</label><input id="u_ceo" class="input" placeholder="Ví dụ: Duyệt mức chiết khấu tối đa 5%?"></div><div class="field span2"><label>Link bằng chứng/tài liệu</label><input id="u_link" class="input" placeholder="https://drive.google.com/..."></div></div><div class="hint" style="margin-top:14px"><b>Không ghi:</b> “đã gọi”, “đang follow”. Hãy ghi điều gì đã thay đổi, việc tiếp theo và hạn cụ thể.</div><button class="btn" style="margin-top:14px" onclick="saveUpdate()">Lưu cập nhật</button></div>`;loadAccountOptions();}
function loadAccountOptions(){callApi('accounts',{q:''},rows=>{const el=document.getElementById('u_account');if(!el)return;el.innerHTML='<option value="">Không gắn với trường</option>'+rows.map(a=>`<option value="${esc(a.account_id)}">${esc(a.ten_don_vi)}</option>`).join('');});}
function saveUpdate(){const p={account_id:val('u_account'),loai_cap_nhat:val('u_type'),ket_qua:val('u_result'),trang_thai_moi:val('u_status'),viec_tiep_theo:val('u_next'),han:val('u_due'),muc_do:val('u_level'),noi_dung_can_ceo:val('u_ceo'),bang_chung_url:val('u_link')};callApi('quickUpdate',p,r=>{toast(r.message||'Đã lưu');['u_result','u_next','u_due','u_ceo','u_link'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});showScreen('home');});}

function loadTasks(filter='DOING'){callApi('tasks',{filter},rows=>renderTasks(rows,filter));}
function renderTasks(rows,filter){document.getElementById('screen-tasks').innerHTML=`<div class="page-head"><div><h1>Công việc của tôi</h1><p>Mỗi việc phải có người chịu trách nhiệm, việc tiếp theo và hạn.</p></div></div><div class="tabs">${[['DOING','Đang làm'],['WAITING','Chờ'],['OVERDUE','Quá hạn'],['DONE','Hoàn thành']].map(([k,l])=>`<button class="${filter===k?'active':''}" onclick="loadTasks('${k}')">${l}</button>`).join('')}</div><div class="card">${rows.length?rows.map(taskHtml).join(''):'<div class="muted small">Không có công việc trong nhóm này.</div>'}</div>`;}

function loadAccounts(q=''){callApi('accounts',{q},rows=>{document.getElementById('screen-accounts').innerHTML=`<div class="page-head"><div><h1>Trường & đơn vị</h1><p>Một trường có thể có nhiều cơ hội theo thời gian.</p></div></div><div class="card"><input class="input" placeholder="Tìm trường, địa bàn, người quyết định..." value="${esc(q)}" onkeydown="if(event.key==='Enter')loadAccounts(this.value)"></div><div class="card" style="margin-top:12px">${rows.length?rows.map(a=>`<div class="account"><div><b>${esc(a.ten_don_vi)}</b><div class="task-sub">${esc(a.tinh_thanh||'')} · ${esc(statusLabel(a.trang_thai))}</div></div><div><b>${esc(a.viec_tiep_theo||'Chưa có việc tiếp theo')}</b><div class="task-sub">${a.han_viec_tiep_theo?'Hạn '+esc(dateLabel(a.han_viec_tiep_theo)):''}${a.cong_no_hien_tai?' · Công nợ '+money(a.cong_no_hien_tai):''}</div></div></div>`).join(''):'<div class="muted small">Chưa có trường phù hợp.</div>'}</div>`;});}

function loadWeekly(){callApi('weekly',{},r=>{CURRENT_WEEKLY=r;document.getElementById('screen-weekly').innerHTML=`<div class="page-head"><div><span class="chip">Tự động tổng hợp</span><h1>Báo cáo tuần ${dateLabel(r.tuan_tu)} → ${dateLabel(r.tuan_den)}</h1><p>Không viết lại từ đầu. Chỉ review, bổ sung nhận định và gửi.</p></div></div><div class="grid2"><div class="card"><h2>Kết quả chính</h2><div class="report-box">${esc(r.ket_qua_chinh||'')}</div></div><div class="card"><h2>Thay đổi quan trọng</h2><div class="report-box">${esc(r.thay_doi_quan_trong||'')}</div></div><div class="card"><h2>Vấn đề đang mở</h2><div class="report-box">${esc(r.van_de_mo||'')}</div></div><div class="card"><h2>Ưu tiên tuần tới</h2><textarea id="w_next" class="input">${esc(r.uu_tien_tuan_toi||'')}</textarea></div></div><div class="card" style="margin-top:16px"><h2>Nhận định của tôi</h2><textarea id="w_note" class="input" placeholder="Điều gì đáng chú ý nhất? Xu hướng nào CEO cần biết?">${esc(r.nhan_dinh||'')}</textarea>${String(r.da_gui).toUpperCase()==='TRUE'?'<span class="chip" style="margin-top:12px">Đã gửi báo cáo</span>':'<button class="btn" style="margin-top:12px" onclick="submitWeekly()">Gửi báo cáo tuần</button>'}</div>`;});}
function submitWeekly(){if(!CURRENT_WEEKLY)return;callApi('submitWeekly',{report_id:CURRENT_WEEKLY.report_id,uu_tien_tuan_toi:val('w_next'),nhan_dinh:val('w_note')},r=>{toast(r.message||'Đã gửi');loadWeekly();});}

function loadAdmin(){if(!(BOOT&&BOOT.can['admin.people']))return;callApi('adminPeople',{},rows=>{document.getElementById('screen-admin').innerHTML=`<div class="page-head"><div><h1>Nhân sự & vai trò</h1><p>Một người có thể có nhiều vai trò. Đổi/kiêm vai trò không làm mất lịch sử.</p></div><button class="btn" onclick="openAddPerson()">+ Thêm nhân sự</button></div><div id="adminForm"></div><div class="card">${rows.map(p=>`<div class="account"><div><b>${esc(p.ho_ten)}</b><div class="task-sub">${esc(p.email)} · ${esc(p.dia_ban||'')}</div></div><div><span class="chip">${esc((p.roles||[]).join(' + '))}</span></div></div>`).join('')}</div>`;});}
function openAddPerson(){document.getElementById('adminForm').innerHTML=`<div class="card" style="margin-bottom:12px"><div class="form-grid"><div class="field"><label>Họ tên</label><input id="a_name" class="input"></div><div class="field"><label>Email Google</label><input id="a_email" class="input"></div><div class="field"><label>Địa bàn</label><input id="a_region" class="input"></div><div class="field"><label>Vai trò ban đầu</label><select id="a_role" class="input"><option value="TEACHER">Giáo viên</option><option value="MARKET">Phát triển thị trường</option><option value="TRAINER">Trainer</option><option value="SALE_OPS">Sale Operations</option><option value="OPS_ADMIN">Vận hành – tài liệu</option><option value="REGION_LEAD">Quản lý vùng</option></select></div></div><button class="btn" style="margin-top:12px" onclick="addPerson()">Tạo nhân sự</button></div>`;}
function addPerson(){callApi('addPerson',{ho_ten:val('a_name'),email:val('a_email'),dia_ban:val('a_region'),roles:[val('a_role')]},()=>{toast('Đã thêm nhân sự');loadAdmin();});}

function val(id){const e=document.getElementById(id);return e?e.value.trim():''}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function money(v){const n=Number(v||0);if(!n)return'0';if(n>=1000000000)return(n/1000000000).toFixed(1).replace('.0','')+' tỷ';if(n>=1000000)return(n/1000000).toFixed(1).replace('.0','')+'tr';return new Intl.NumberFormat('vi-VN').format(n)}function dateLabel(v){if(!v)return'';const d=new Date(v);if(isNaN(d))return String(v);return d.toLocaleDateString('vi-VN')}function statusLabel(s){return ({NEW:'Mới',CONTACTED:'Đã liên hệ',QUALIFIED:'Đủ điều kiện',MEETING:'Đã làm việc',PROPOSAL:'Đã gửi đề xuất',NEGOTIATION:'Đang đàm phán',WAITING:'Đang chờ',WON:'Đã chốt',ACTIVE:'Đang hoạt động',ON_HOLD:'Tạm dừng',LOST:'Không tiếp tục',CLOSED:'Đóng'})[s]||s||''}function setLoading(v){document.getElementById('loading').classList.toggle('hidden',!v)}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3000)}function showError(e){setLoading(false);toast(e&&e.message?e.message:String(e));if(String(e&&e.message||'').toLowerCase().includes('đăng nhập'))document.getElementById('loginView').classList.remove('hidden')}
</script>
